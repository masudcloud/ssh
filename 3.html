<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VPN Clipboard Manager</title>
  <style>
    :root {
      --text-main: #1d1d1f;
      --text-secondary: rgba(29, 29, 31, 0.7);
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 10px 40px 0 rgba(31, 38, 135, 0.1);
      --accent: #007aff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      /* Deep vibrant gradient background */
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Ambient animated orbs to create the "liquid" feel beneath the glass */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      opacity: 0.9;
      animation: float 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .orb-1 {
      width: 70vw;
      height: 70vw;
      background: #ff9a9e;
      top: -20%;
      left: -20%;
      animation-delay: 0s;
    }
    
    .orb-2 {
      width: 80vw;
      height: 80vw;
      background: #fecfef;
      bottom: -30%;
      right: -20%;
      animation-delay: -5s;
    }
    
    .orb-3 {
      width: 60vw;
      height: 60vw;
      background: #a18cd1;
      top: 40%;
      left: 50%;
      animation-delay: -10s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -60px) scale(1.1); }
      66% { transform: translate(-30px, 30px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .header {
      text-align: center;
      padding: 60px 15px 30px;
      position: relative;
      z-index: 10;
    }

    .header h1 {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      margin: 0 0 8px;
      background: rgba(0, 0, 0, 0.85);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 1.15rem;
      margin: 0;
      color: rgba(0,0,0,0.65);
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px 60px;
      display: grid;
      /* Fixed responsiveness: never overflows screen width, auto switches to 1 column on mobile */
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 24px;
      position: relative;
      z-index: 10;
    }

    .server-card {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 26px;
      /* Intense glass shadow and inner white lip to simulate glass edge */
      box-shadow: var(--glass-shadow), inset 0 1.5px 0 rgba(255,255,255,0.9), inset 1px 0 0 rgba(255,255,255,0.4);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
      display: flex;
      flex-direction: column;
      gap: 22px;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .server-card:hover {
      transform: translateY(-6px);
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.9), 0 20px 50px rgba(31, 38, 135, 0.15);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .server-header {
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding-bottom: 16px;
    }

    .server-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      color: #111;
      letter-spacing: -0.5px;
    }

    .clipboard-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .clipboard-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(0,0,0,0.45);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .clipboard-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 18px;
      padding: 10px 10px 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
      gap: 12px;
    }

    .clipboard-value {
      font-family: ui-monospace, "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
      font-size: 1rem;
      color: #222;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0; /* allows flex-child to truncate */
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255,255,255,1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
      outline: none;
    }

    .copy-btn:hover {
      background: #fff;
      transform: scale(1.06);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .copy-btn:active {
      transform: scale(0.94);
      background: #f0f0f5;
    }

    /* iOS Toast */
    .toast-container {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-150px) scale(0.9);
      opacity: 0;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      width: max-content;
      max-width: 90vw;
    }

    .toast-container.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }

    .toast {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 20px 60px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,1);
      padding: 18px 32px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .toast-icon {
      background: #34c759;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3);
    }

    .toast-icon svg {
      width: 16px;
      height: 16px;
    }

    .toast-message {
      font-weight: 700;
      font-size: 1.1rem;
      color: #111;
      letter-spacing: -0.4px;
    }

    /* Tablet adjustments */
    @media (max-width: 768px) {
      .header { padding: 50px 15px 25px; }
      .server-card { padding: 22px; border-radius: 28px; }
      .container { gap: 18px; }
      .toast-container { top: 30px; }
    }

    /* True Mobile Responsiveness adjustments */
    @media (max-width: 480px) {
      .clipboard-row {
        /* Stack text and button vertically to prevent horizontal overflow */
        flex-direction: column;
        align-items: stretch;
        padding: 16px;
        border-radius: 20px;
        gap: 16px;
      }
      .clipboard-value {
        text-align: center;
        margin-right: 0;
      }
      .copy-btn {
        width: 100%;
        padding: 14px;
        font-size: 1.05rem;
      }
      .toast {
        padding: 14px 24px;
      }
      .toast-message {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Orbs for the Liquid Effect -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <header class="header">
    <h1>VPN Servers</h1>
    <p>Manage your connections easily</p>
  </header>

  <main class="container" id="servers-container">
    <!-- Server cards will be injected here -->
  </main>

  <!-- iOS Toast Notification -->
  <div class="toast-container" id="toast-container" aria-live="polite">
    <div class="toast">
      <div class="toast-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="toast-message" id="toast-message">Copied successfully</div>
    </div>
  </div>

  <script>
    const servers = [
      { name: "India 1", password: "123456" },
      { name: "India 2", password: "india2_pass" },
      { name: "Singapore 1", password: "sg1_secure" },
      { name: "Singapore 2", password: "sg2_secure" },
      { name: "Pakistan 1", password: "pk1_access" },
      { name: "Pakistan 2", password: "pk2_access" },
      { name: "USA 1", password: "us1_admin" },
      { name: "USA 2", password: "us2_admin" },
      { name: "UK 1", password: "uk1_london" },
      { name: "UK 2", password: "uk2_london" },
      { name: "Germany 1", password: "de1_berlin" },
      { name: "Germany 2", password: "de2_berlin" },
      { name: "Japan 1", password: "jp1_tokyo" },
      { name: "Japan 2", password: "jp2_tokyo" },
      { name: "Australia 1", password: "au1_sydney" }
    ];

    const SUFFIX = "-vpnjanti.com";

    function renderServers() {
      const container = document.getElementById('servers-container');
      container.innerHTML = '';

      servers.forEach((server, index) => {
        const card = document.createElement('div');
        card.className = 'server-card';
        card.style.animationDelay = `${index * 0.04}s`;

        const secondPassword = server.password + SUFFIX;

        card.innerHTML = `
          <div class="server-header">
            <h2 class="server-title">${server.name}</h2>
          </div>
          
          <div class="clipboard-group">
            <div class="clipboard-label">Primary Credential</div>
            <div class="clipboard-row">
              <div class="clipboard-value" title="${server.password}">${server.password}</div>
              <button class="copy-btn" 
                      aria-label="Copy ${server.name} primary credential" 
                      data-copy="${server.password}" 
                      data-toast="${server.name} — Primary copied">Copy</button>
            </div>
          </div>

          <div class="clipboard-group">
            <div class="clipboard-label">Generated Credential</div>
            <div class="clipboard-row">
              <div class="clipboard-value" title="${secondPassword}">${secondPassword}</div>
              <button class="copy-btn" 
                      aria-label="Copy ${server.name} generated credential" 
                      data-copy="${secondPassword}" 
                      data-toast="${server.name} — Generated copied">Copy</button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      const copyButtons = document.querySelectorAll('.copy-btn');
      copyButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const textToCopy = btn.getAttribute('data-copy');
          const toastMessage = btn.getAttribute('data-toast');
          copyText(textToCopy, toastMessage);
        });
      });
    }

    function copyText(text, toastMessage) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(toastMessage);
        }).catch(err => {
          console.error('Clipboard failed:', err);
          fallbackCopyTextToClipboard(text, toastMessage);
        });
      } else {
        fallbackCopyTextToClipboard(text, toastMessage);
      }
    }

    function fallbackCopyTextToClipboard(text, toastMessage) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        if (document.execCommand('copy')) {
          showToast(toastMessage);
        } else {
          alert('Failed to copy. Please try manually.');
        }
      } catch (err) {
        alert('Failed to copy. Please try manually.');
      }
      document.body.removeChild(textArea);
    }

    let toastTimeout;

    function showToast(message) {
      const toastContainer = document.getElementById('toast-container');
      const toastMessageEl = document.getElementById('toast-message');
      
      toastMessageEl.textContent = message;
      toastContainer.classList.remove('show');
      void toastContainer.offsetWidth; // Force reflow
      toastContainer.classList.add('show');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastContainer.classList.remove('show');
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', renderServers);
  </script>
</body>
</html>
