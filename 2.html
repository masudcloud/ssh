<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VPN Clipboard Manager</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f;
            --text-secondary: rgba(29, 29, 31, 0.7);
            --btn-bg: rgba(255, 255, 255, 0.9);
            --btn-bg-hover: #ffffff;
            --btn-border: rgba(255, 255, 255, 1);
            --accent: #007aff;
            --glass-shadow: 0 10px 40px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) max(40px, env(safe-area-inset-bottom)) env(safe-area-inset-left);
            overflow-x: hidden;
        }

        /* Ambient animated orbs to create the "liquid" feel beneath the glass */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.9;
            animation: float 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orb-1 {
            width: 70vw;
            height: 70vw;
            background: #ff9a9e;
            top: -20%;
            left: -20%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 80vw;
            height: 80vw;
            background: #fecfef;
            bottom: -30%;
            right: -20%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 60vw;
            height: 60vw;
            background: #a18cd1;
            top: 40%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -60px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .header {
            text-align: center;
            padding: 60px 15px 30px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -1.5px;
            margin: 0 0 8px;
            background: rgba(0, 0, 0, 0.85);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.15rem;
            margin: 0;
            color: rgba(0,0,0,0.65);
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
            gap: 24px;
            position: relative;
            z-index: 10;
        }

        .server-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 26px;
            box-shadow: var(--glass-shadow), inset 0 1.5px 0 rgba(255,255,255,0.9), inset 1px 0 0 rgba(255,255,255,0.4);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            gap: 22px;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .server-card:hover {
            transform: translateY(-6px);
            box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.9), 0 20px 50px rgba(31, 38, 135, 0.15);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .server-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            padding-bottom: 16px;
        }

        .server-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: #111;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .server-status {
            font-size: 0.85rem;
            font-weight: 600;
            color: #34c759;
            background: rgba(52, 199, 89, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .server-status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #34c759;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.6);
        }

        /* Metadata Section */
        .server-info {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
            position: relative;
        }
        
        .server-info::before {
            content: 'Server Information';
            position: absolute;
            top: -10px;
            left: 16px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 6px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Clipboards */
        .clipboard-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .clipboard-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: rgba(0,0,0,0.45);
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .clipboard-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 18px;
            padding: 10px 10px 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
            gap: 12px;
        }

        .clipboard-row:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        .clipboard-value {
            font-family: ui-monospace, "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
            font-size: 1rem;
            color: #222;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .copy-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            outline: none;
            min-width: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .copy-btn:hover {
            background: var(--btn-bg-hover);
            transform: scale(1.06);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .copy-btn:active {
            transform: scale(0.94);
            background: #f0f0f5;
        }
        
        .copy-btn.copied {
            background: #34c759;
            color: white;
            border-color: #34c759;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3);
        }

        /* iOS Toast */
        .toast-container {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px) scale(0.9);
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 9999;
            width: max-content;
            max-width: 90vw;
        }

        .toast-container.show {
            transform: translateX(-50%) translateY(0) scale(1);
            opacity: 1;
        }

        .toast {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,1);
            padding: 18px 32px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .toast-icon {
            background: #34c759;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3);
        }

        .toast-icon svg {
            width: 16px;
            height: 16px;
        }

        .toast-message {
            font-weight: 700;
            font-size: 1.1rem;
            color: #111;
            letter-spacing: -0.4px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header { padding: 50px 15px 25px; }
            .server-card { padding: 22px; border-radius: 28px; }
            .container { gap: 18px; }
            .toast-container { top: 30px; }
        }

        @media (max-width: 480px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .clipboard-row {
                flex-direction: column;
                align-items: stretch;
                padding: 16px;
                border-radius: 20px;
                gap: 16px;
            }
            .clipboard-value {
                text-align: center;
                margin-right: 0;
            }
            .copy-btn {
                width: 100%;
                padding: 14px;
                font-size: 1.05rem;
            }
            .toast {
                padding: 14px 24px;
            }
            .toast-message {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Decorative Liquid Background -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <header class="header">
        <h1>VPN Servers</h1>
        <p>Manage your connections easily</p>
    </header>

    <main class="container" id="servers-container">
        <!-- Server cards will be injected here via JS -->
    </main>

    <!-- iOS Style Toast Notification -->
    <div class="toast-container" id="toast-container" aria-live="polite">
        <div class="toast">
            <div class="toast-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="toast-message" id="toast-message">Copied successfully</div>
        </div>
    </div>

    <script>
        // Data Architecture: 15 unique servers with comprehensive metadata
        const servers = [
            { id: 1, country: "Bangladesh", name: "🇧🇩 Bangladesh 02", userCredential: "UKarkUNZUPLQ", primaryCredential: "6vZrS$Fvb9ck", sshHost: "38.54.42.224", port: 2086, validity: "5 Days", location: "Dhaka, Bangladesh", isp: "KAOPU", status: "Active" },
            { id: 2, country: "India", name: "🇮🇳 India 02", userCredential: "username456", primaryCredential: "def789012", sshHost: "192.168.1.101", port: 22, validity: "30 Days", location: "Delhi, India", isp: "Jio", status: "Active" },
            { id: 3, country: "Singapore", name: "🇸🇬 Singapore 01", userCredential: "user_sg1", primaryCredential: "sg1_secure_pw", sshHost: "10.0.1.1", port: 2222, validity: "90 Days", location: "Singapore City", isp: "Singtel", status: "Active" },
            { id: 4, country: "Singapore", name: "🇸🇬 Singapore 02", userCredential: "user_sg2", primaryCredential: "sg2_secure_pw", sshHost: "10.0.1.2", port: 2222, validity: "60 Days", location: "Singapore City", isp: "StarHub", status: "Active" },
            { id: 5, country: "Pakistan", name: "🇵🇰 Pakistan 01", userCredential: "user_pk1", primaryCredential: "pk1_access_key", sshHost: "10.0.2.1", port: 22, validity: "15 Days", location: "Karachi, Pakistan", isp: "PTCL", status: "Active" },
            { id: 6, country: "Pakistan", name: "🇵🇰 Pakistan 02", userCredential: "user_pk2", primaryCredential: "pk2_access_key", sshHost: "10.0.2.2", port: 22, validity: "15 Days", location: "Lahore, Pakistan", isp: "Nayatel", status: "Active" },
            { id: 7, country: "USA", name: "🇺🇸 USA 01", userCredential: "user_us1", primaryCredential: "us1_admin_pass", sshHost: "10.0.3.1", port: 8080, validity: "30 Days", location: "New York, USA", isp: "Comcast", status: "Active" },
            { id: 8, country: "USA", name: "🇺🇸 USA 02", userCredential: "user_us2", primaryCredential: "us2_admin_pass", sshHost: "10.0.3.2", port: 8080, validity: "30 Days", location: "Los Angeles, USA", isp: "Spectrum", status: "Active" },
            { id: 9, country: "UK", name: "🇬🇧 UK 01", userCredential: "user_uk1", primaryCredential: "uk1_london_pass", sshHost: "10.0.4.1", port: 22, validity: "45 Days", location: "London, UK", isp: "BT", status: "Active" },
            { id: 10, country: "UK", name: "🇬🇧 UK 02", userCredential: "user_uk2", primaryCredential: "uk2_london_pass", sshHost: "10.0.4.2", port: 22, validity: "45 Days", location: "Manchester, UK", isp: "Virgin Media", status: "Active" },
            { id: 11, country: "Germany", name: "🇩🇪 Germany 01", userCredential: "user_de1", primaryCredential: "de1_berlin_sec", sshHost: "10.0.5.1", port: 22, validity: "30 Days", location: "Berlin, Germany", isp: "Telekom", status: "Active" },
            { id: 12, country: "Germany", name: "🇩🇪 Germany 02", userCredential: "user_de2", primaryCredential: "de2_berlin_sec", sshHost: "10.0.5.2", port: 22, validity: "30 Days", location: "Frankfurt, Germany", isp: "Vodafone", status: "Active" },
            { id: 13, country: "Japan", name: "🇯🇵 Japan 01", userCredential: "user_jp1", primaryCredential: "jp1_tokyo_auth", sshHost: "10.0.6.1", port: 22, validity: "60 Days", location: "Tokyo, Japan", isp: "NTT", status: "Active" },
            { id: 14, country: "Japan", name: "🇯🇵 Japan 02", userCredential: "user_jp2", primaryCredential: "jp2_tokyo_auth", sshHost: "10.0.6.2", port: 22, validity: "60 Days", location: "Osaka, Japan", isp: "KDDI", status: "Active" },
            { id: 15, country: "Australia", name: "🇦🇺 Australia 01", userCredential: "user_au1", primaryCredential: "au1_sydney_key", sshHost: "10.0.7.1", port: 22, validity: "90 Days", location: "Sydney, Australia", isp: "Telstra", status: "Active" }
        ];

        // The logic suffix for the Magnesium CRM Password
        const SUFFIX = "-vpnjantit.com";

        function renderServers() {
            const container = document.getElementById('servers-container');
            container.innerHTML = '';

            servers.forEach((server, index) => {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.style.animationDelay = `${index * 0.04}s`; // staggered entrance

                // IMPORTANT PASSWORD LOGIC: Generate the third credential based on the VJ input Password
                const generatedCredential = server.primaryCredential + SUFFIX;
                
                // Clean server name for toast usage
                const cleanServerName = server.name.replace(/[^a-zA-Z0-9 ]/g, "").trim();

                card.innerHTML = `
                  <div class="server-header">
                    <h2 class="server-title">${server.name}</h2>
                    <div class="server-status">${server.status}</div>
                  </div>
                  
                  <div class="server-info">
                      <div class="info-grid">
                          <div class="info-item">
                              <span class="info-label">SSH Host</span>
                              <span class="info-value" title="${server.sshHost}">${server.sshHost}</span>
                          </div>
                          <div class="info-item">
                              <span class="info-label">Port</span>
                              <span class="info-value">${server.port}</span>
                          </div>
                          <div class="info-item">
                              <span class="info-label">Validity</span>
                              <span class="info-value">${server.validity}</span>
                          </div>
                          <div class="info-item">
                              <span class="info-label">Location</span>
                              <span class="info-value" title="${server.location}">${server.location}</span>
                          </div>
                          <div class="info-item" style="grid-column: 1 / -1;">
                              <span class="info-label">ISP</span>
                              <span class="info-value" title="${server.isp}">${server.isp}</span>
                          </div>
                      </div>
                  </div>
                  
                  <!-- 1. UserID -->
                  <div class="clipboard-group">
                    <div class="clipboard-label">UserID</div>
                    <div class="clipboard-row">
                      <div class="clipboard-value" title="UserID: ${server.userCredential}">${server.userCredential}</div>
                      <button class="copy-btn" 
                              aria-label="Copy ${cleanServerName} UserID" 
                              data-copy="${server.userCredential}" 
                              data-toast="${cleanServerName} · UserID">Copy UserID</button>
                    </div>
                  </div>

                  <!-- 2. VJ input Password -->
                  <div class="clipboard-group">
                    <div class="clipboard-label">VJ input Password</div>
                    <div class="clipboard-row">
                      <div class="clipboard-value" title="VJ input Password: ${server.primaryCredential}">${server.primaryCredential}</div>
                      <button class="copy-btn" 
                              aria-label="Copy ${cleanServerName} VJ input Password" 
                              data-copy="${server.primaryCredential}" 
                              data-toast="${cleanServerName} · VJ input Password">Copid VJ Input Password</button>
                    </div>
                  </div>

                  <!-- 3. Magnesium CRM Password -->
                  <div class="clipboard-group">
                    <div class="clipboard-label">Magnesium CRM Password</div>
                    <div class="clipboard-row">
                      <div class="clipboard-value" title="Magnesium CRM Password: ${generatedCredential}">${generatedCredential}</div>
                      <button class="copy-btn" 
                              aria-label="Copy ${cleanServerName} Magnesium CRM Password" 
                              data-copy="${generatedCredential}" 
                              data-toast="${cleanServerName} · Magnesium CRM Password">Magnesium CRM Password</button>
                    </div>
                  </div>
                `;

                container.appendChild(card);
            });

            // Attach event listeners safely
            const copyButtons = document.querySelectorAll('.copy-btn');
            copyButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const textToCopy = btn.getAttribute('data-copy');
                    const toastMessage = btn.getAttribute('data-toast');
                    copyText(textToCopy, toastMessage, btn);
                });
            });
        }

        function copyText(text, toastMessage, buttonElement) {
            // Button Animation Logic
            const originalText = buttonElement.textContent;
            buttonElement.textContent = "✓ Copied";
            buttonElement.classList.add("copied");
            
            setTimeout(() => {
                buttonElement.textContent = originalText;
                buttonElement.classList.remove("copied");
            }, 2000);

            // Use modern Clipboard API if available and securely contexted
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(toastMessage);
                }).catch(err => {
                    console.error('Clipboard API failed: ', err);
                    fallbackCopyTextToClipboard(text, toastMessage);
                });
            } else {
                // Fallback for older browsers or non-secure contexts (HTTP/file://)
                fallbackCopyTextToClipboard(text, toastMessage);
            }
        }

        function fallbackCopyTextToClipboard(text, toastMessage) {
            const textArea = document.createElement("textarea");
            textArea.value = text;

            // Prevent scrolling to the bottom by placing it at the top
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            textArea.style.opacity = "0"; // Invisible

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast(toastMessage);
                } else {
                    console.error('Fallback: Copy command was unsuccessful');
                    alert('Failed to copy text. Please try manually.');
                }
            } catch (err) {
                console.error('Fallback: Unable to copy', err);
                alert('Failed to copy text. Please try manually.');
            }

            document.body.removeChild(textArea);
        }

        let toastTimeout;

        function showToast(message) {
            const toastContainer = document.getElementById('toast-container');
            const toastMessageEl = document.getElementById('toast-message');

            toastMessageEl.textContent = message;

            toastContainer.classList.remove('show');

            // Force a browser reflow to reset the animation if called repeatedly
            void toastContainer.offsetWidth;

            toastContainer.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastContainer.classList.remove('show');
            }, 2500);
        }

        // Initialize application
        document.addEventListener('DOMContentLoaded', () => {
            renderServers();
        });
    </script>
</body>

</html>
