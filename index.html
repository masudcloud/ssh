<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VPN Clipboard Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative Liquid Background -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <header class="header">
    <h1>VPN Servers</h1>
    <p>Manage your connections easily</p>
  </header>

  <main class="container" id="servers-container">
    <!-- Server cards will be injected here via JS -->
  </main>

  <!-- iOS Style Toast Notification -->
  <div class="toast-container" id="toast-container" aria-live="polite">
    <div class="toast">
      <div class="toast-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="toast-message" id="toast-message">Copied successfully</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
